[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsf"
version = "0.1.0"
description = "Reconnaissance de signes isoles (ASL puis LSF) a partir de points cles MediaPipe"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
data = ["pandas", "pyarrow"]
demo = ["mediapipe", "opencv-contrib-python"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
